name: Deploy to Firebase Hosting on merge
on:
  push:
    branches:
      - main

env:
  GCP_PROJECT_ID: zodiac-crm-app
  RUN_SERVICE: zodiac-crm-ssr
  RUN_REGION: us-central1

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install

      - name: Build (Node/SSR target)
        env:
          NITRO_PRESET: node
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.VITE_SUPABASE_PUBLISHABLE_KEY }}
          VITE_SUPABASE_PROJECT_ID: ${{ secrets.VITE_SUPABASE_PROJECT_ID }}
        run: bun run build

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZODIAC_CRM_APP }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Deploy SSR server to Cloud Run
        run: |
          gcloud run deploy "$RUN_SERVICE" \
            --project "$GCP_PROJECT_ID" \
            --region "$RUN_REGION" \
            --source . \
            --allow-unauthenticated \
            --port 8080 \
            --set-env-vars "SUPABASE_URL=${{ secrets.SUPABASE_URL }},SUPABASE_PUBLISHABLE_KEY=${{ secrets.SUPABASE_PUBLISHABLE_KEY }},LOVABLE_API_KEY=${{ secrets.LOVABLE_API_KEY }}"

      - name: Deploy static assets + rewrites to Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_ZODIAC_CRM_APP }}
          channelId: live
          projectId: zodiac-crm-app
